{% extends "base.html" %}
{% block title %}Добавить дисциплину | Виртуальный деканат{% endblock %}
{% block content %}
<section class="card small-card">
    <h2>Добавить дисциплину</h2>
    <form method="post" class="form-grid">
        <label>
            Название *
            <input type="text" name="name" required>
        </label>
        <label>
            Описание
            <textarea name="description" rows="3"></textarea>
        </label>
        <label>
            Кредиты
            <input type="number" name="credits" value="3" min="1" max="12">
        </label>
        <button type="submit">Добавить</button>
        <a href="/references/disciplines">Отмена</a>
    </form>
</section>

<style>
.form-grid { display: grid; gap: 12px; }
label { display: grid; gap: 6px; }
input, textarea { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
button, a { padding: 10px 16px; background: #0b5cab; color: white; border: none; border-radius: 8px; text-decoration: none; cursor: pointer; }
button:hover, a:hover { background: #083d7a; }
a { display: inline-block; }
</style>
{% endblock %}
